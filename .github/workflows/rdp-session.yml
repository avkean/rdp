name: Kali Desktop Session

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Session duration (hours)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4', '6']
      vnc_password:
        description: 'VNC password (6-8 chars)'
        required: true
        default: 'kali123'

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Kali Desktop
        run: |
          docker run --rm \
            --shm-size=1g \
            -p 6901:6901 \
            -e VNC_PASSWORD="${{ github.event.inputs.vnc_password }}" \
            -e SESSION_HOURS="${{ github.event.inputs.session_duration }}" \
            -e NGROK_AUTH_TOKEN="${{ secrets.NGROK_AUTH_TOKEN }}" \
            ghcr.io/${{ github.repository }}/kali-desktop:latest
