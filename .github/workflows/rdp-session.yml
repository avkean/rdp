name: Kali Desktop Session

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Session duration (hours)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4', '6']
      vnc_password:
        description: 'VNC password (6-8 chars)'
        required: true
        default: 'kali123'

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      IMAGE: ghcr.io/${{ github.repository }}/kali-desktop:latest

    steps:
      # Free disk to fit the pulled image + running container
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Start Kali Desktop
        run: |
          docker run --rm \
            --shm-size=512m \
            --network host \
            -e VNC_PASSWORD="${{ github.event.inputs.vnc_password }}" \
            -e SESSION_HOURS="${{ github.event.inputs.session_duration }}" \
            -e NGROK_AUTH_TOKEN="${{ secrets.NGROK_AUTH_TOKEN }}" \
            "$IMAGE"
